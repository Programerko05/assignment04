<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Shop</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="header-container">
        <a href="shop.html" class="logo">NOVA</a>
        <nav>
          <a href="shop.html" class="nav-link">Shop</a>
          <a href="login.html" class="nav-link">Login</a>
          <a href="#" id="cart-counter" class="cart-badge">Cart</a>
        </nav>
      </div>
    </header>

    <!-- Glavni kontenjer -->
    <main>
      <!-- Hero sekcija -->
      <section class="hero">
        <div class="hero-content">
          <span class="badge">New Collection</span>
          <h1>Timelsee Essentials for Modern Living</h1>
          <p>
            Discover our latest capsule of refined garments, crafted with
            organic cotton, French linen, and premium wool.
          </p>
          <a href="#shop-products" class="btn btn-hero">Shop Now</a>
        </div>
      </section>

      <section class="products-section" id="shop-products">
        <h2 class="section-title">New Collection</h2>
        <div id="product-container" class="product-grid"></div>
      </section>
    </main>
    <script src="js/shop.js"></script>
  </body>
</html>
